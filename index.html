<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サーバー認証 - 認証システム</title>
    
   
    <link rel="icon" href="./favicon.ico" type="image/x-icon">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cloudflare Turnstile のスクリプト -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between font-sans text-slate-800">

    <!-- ヘッダー -->
    <header class="w-full py-6 px-8 bg-white border-b border-slate-100 shadow-sm">
        <h1 class="text-xl font-bold text-indigo-600">🔐 Discord Server Auth</h1>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100 text-center">
            
            <div id="auth-box">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full mb-6">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>

                <h2 class="text-2xl font-bold mb-2">セキュリティ検証</h2>
                <p class="text-slate-500 text-sm mb-6">悪意ある操作を防止するため、以下のチェックを完了してください。</p>

                <!-- トークン表示用（確認用） -->
                <div id="token-display" class="bg-slate-100 p-3 rounded-lg text-xs font-mono text-slate-600 mb-6 break-all">
                    URLトークンを読み込み中...
                </div>

                <!-- 👇 Cloudflare Turnstile ウィジェットの配置場所 -->
                <!-- サイトキー（sitekey）はCloudflareダッシュボードで発行したものを指定してください -->
                <div class="flex justify-center mb-6">
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAAFL8gbxTE-64Li3m" data-callback="onTurnstileSuccess"></div>
                </div>

                <!-- 認証実行ボタン -->
                <button id="verify-btn" onclick="executeAuth()" disabled class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-lg shadow-indigo-100 opacity-50 cursor-not-allowed">
                    認証を完了する
                </button>
            </div>

            <!-- 完了後に切り替える画面 -->
            <div id="success-box" class="hidden">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full mb-6">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold mb-2 text-slate-800">認証が完了しました！</h2>
                <p class="text-slate-500 text-sm mb-6">Discordサーバーに戻り、ロールが付与されているかご確認ください。</p>
                <p class="text-xs text-slate-400">このページは閉じても問題ありません。</p>
            </div>

        </div>
    </main>

    <!-- フッター -->
    <footer class="w-full py-4 text-center text-xs text-slate-400 border-t border-slate-100">
        &copy; AuthBot System. All rights reserved.
    </footer>

    <!-- スクリプト処理 -->
    <script>
        // 1. URLからDiscord Botのトークンを取得
        function extractToken() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token');
        }

        const discordToken = extractToken();
        const tokenDisplay = document.getElementById('token-display');
        let turnstileToken = null; // Turnstileの認証完了トークン

        if (discordToken) {
            tokenDisplay.textContent = `Discord Token: ${discordToken.substring(0, 10)}...（確認OK）`;
        } else {
            tokenDisplay.textContent = 'エラー: 有効なトークンが見つかりません。';
        }

        // 2. Turnstileの検証が成功したときに呼ばれるコールバック関数
        function onTurnstileSuccess(token) {
            turnstileToken = token;
            const btn = document.getElementById('verify-btn');
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        // 3. 「認証を完了する」ボタンを押したときの処理
        async function executeAuth() {
            if (!discordToken || !turnstileToken) {
                alert('トークンまたはセキュリティ検証が無効です。');
                return;
            }

            const btn = document.getElementById('verify-btn');
            btn.disabled = true;
            btn.textContent = '認証処理中...';

            try {
                // Cloudflare Pages Functions (バックエンド) へデータを送信
                const response = await fetch('/api/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: discordToken,
                        turnstileToken: turnstileToken
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // 成功した場合：画面を成功状態に切り替え
                    document.getElementById('auth-box').classList.add('hidden');
                    document.getElementById('success-box').classList.remove('hidden');
                } else {
                    alert('認証に失敗しました: ' + (result.error || '不明なエラー'));
                    btn.disabled = false;
                    btn.textContent = '認証を完了する';
                }
            } catch (error) {
                console.error('通信エラー:', error);
                alert('サーバーとの通信に失敗しました。');
                btn.disabled = false;
                btn.textContent = '認証を完了する';
            }
        }
    </script>
</body>
</html>
